# Konfigurasi Alembic untuk migrasi database Study Agent.
# Jalankan dari folder `backend/`: alembic ...

[alembic]
# Lokasi folder migration (relatif ke backend/).
script_location = migrations

# Template nama file migration.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepending sys.path agar `app` bisa di-import dari env.py.
prepend_sys_path = .

# Pemisah path (Windows/Linux).
path_separator = os

# URL database diisi dari app.core.config di migrations/env.py,
# jadi nilai placeholder di bawah tidak dipakai.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
